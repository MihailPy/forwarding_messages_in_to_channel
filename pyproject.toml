[project]
name = "telegram-forwarder"
version = "0.1.0"
description = "Telegram message forwarding tool with multi-account support"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.41,<2.0",
  "python-dotenv>=1.0,<2.0",
  "typer>=0.12,<1.0",
  "rich>=13.0,<15.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["."]
exclude = [".venv", "__pycache__"]

[dependency-groups]
dev = ["pyright>=1.1.409", "pytest>=9.0.3", "ruff>=0.15.14"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
